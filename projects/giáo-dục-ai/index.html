<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Giáo Dục - Chuyển Đổi Tương Lai | Hệ Sinh Thái Tâm Vạn Phúc</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2196F3; /* Blue */
            --secondary-color: #4CAF50; /* Green */
            --accent-color: #FFC107; /* Amber */
            --text-dark: #333;
            --text-light: #555;
            --bg-light: #f8f8f8;
            --bg-white: #ffffff;
            --shadow-light: rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
            color: var(--text-light);
            background-color: var(--bg-light);
            scroll-behavior: smooth;
        }

        h1, h2, h3 {
            font-family: 'Montserrat', sans-serif;
            color: var(--text-dark);
            margin-top: 0;
        }

        h1 {
            font-size: 2.8em;
            line-height: 1.2;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 2em;
            margin-bottom: 40px;
            text-align: center;
        }

        h3 {
            font-size: 1.5em;
            margin-bottom: 15px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .section {
            padding: 80px 0;
            text-align: center;
        }

        .section:nth-of-type(even) {
            background-color: var(--bg-white);
        }

        /* Hero Section */
        .hero {
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('https://source.unsplash.com/1600x900/?ai,education,future-learning') no-repeat center center/cover;
            color: #fff;
            padding: 120px 0;
            text-align: center;
            display: flex;
            align-items: center;
            min-height: 60vh;
        }

        .hero h1 {
            color: #fff;
            font-size: 3.5em;
            margin-bottom: 25px;
        }

        .hero p {
            font-size: 1.3em;
            margin-bottom: 40px;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        .cta-button {
            display: inline-block;
            background-color: var(--secondary-color);
            color: #fff;
            padding: 15px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1em;
            transition: background-color 0.3s ease, transform 0.3s ease;
            box-shadow: 0 4px 10px var(--shadow-light);
        }

        .cta-button:hover {
            background-color: #388E3C; /* Darker green */
            transform: translateY(-3px);
        }

        .primary-cta {
            background-color: var(--primary-color);
        }

        .primary-cta:hover {
            background-color: #1976D2; /* Darker blue */
        }

        /* Problem-Solution Section */
        .problem-solution .grid-2 {
            display: flex;
            gap: 30px;
            justify-content: center;
            align-items: flex-start;
        }

        .problem-solution .card {
            background-color: var(--bg-white);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px var(--shadow-light);
            text-align: left;
            flex: 1;
            max-width: 500px;
        }
        
        .problem-solution .card h3 {
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 25px;
        }

        .problem-solution .card ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .problem-solution .card ul li {
            margin-bottom: 15px;
            padding-left: 30px;
            position: relative;
            font-size: 1.1em;
        }

        .problem-solution .card ul li::before {
            content: '⚠️'; /* Warning icon */
            position: absolute;
            left: 0;
            top: 0;
            font-size: 1.2em;
            color: var(--accent-color);
        }
        
        .problem-solution .card.solution h3 {
             color: var(--secondary-color);
        }

        .problem-solution .card.solution ul li::before {
            content: '✅'; /* Checkmark icon */
            color: var(--secondary-color);
        }

        /* Features Section */
        .features .grid-3 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 50px;
        }

        .feature-item {
            background-color: var(--bg-white);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px var(--shadow-light);
            text-align: center;
            transition: transform 0.3s ease;
        }

        .feature-item:hover {
            transform: translateY(-5px);
        }

        .feature-item svg {
            width: 60px;
            height: 60px;
            fill: var(--primary-color);
            margin-bottom: 20px;
        }

        .feature-item h3 {
            color: var(--primary-color);
            font-size: 1.3em;
        }

        .feature-item p {
            font-size: 1em;
            color: var(--text-light);
        }

        /* Call to Action Bottom */
        .cta-bottom {
            background-color: var(--primary-color);
            color: #fff;
            padding: 100px 0;
        }

        .cta-bottom h2 {
            color: #fff;
            font-size: 2.5em;
        }

        .cta-bottom p {
            font-size: 1.2em;
            margin-bottom: 40px;
        }
        
        /* Footer */
        footer {
            background-color: var(--text-dark);
            color: #ccc;
            padding: 40px 0;
            text-align: center;
            font-size: 0.9em;
        }

        footer p {
            margin: 5px 0;
        }

        footer a {
            color: var(--secondary-color);
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        /* Responsive Design */
        @media (max-width: 992px) {
            .hero h1 {
                font-size: 2.8em;
            }
            .hero p {
                font-size: 1.1em;
            }
            h2 {
                font-size: 1.8em;
            }
            .problem-solution .grid-2 {
                flex-direction: column;
                align-items: center;
            }
            .problem-solution .card {
                max-width: 90%;
            }
            .features .grid-3 {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .hero {
                padding: 80px 0;
            }
            .hero h1 {
                font-size: 2.2em;
            }
            .hero p {
                font-size: 1em;
            }
            .section {
                padding: 60px 0;
            }
            h2 {
                font-size: 1.6em;
            }
            .cta-button {
                padding: 12px 25px;
                font-size: 1em;
            }
            .cta-bottom h2 {
                font-size: 2em;
            }
        }

        @media (max-width: 480px) {
            .hero h1 {
                font-size: 1.8em;
            }
            .hero p {
                font-size: 0.9em;
            }
            h2 {
                font-size: 1.4em;
            }
            .problem-solution .card ul li {
                font-size: 0.95em;
            }
            .feature-item h3 {
                font-size: 1.2em;
            }
        }
    </style>
</head>
<body>
    <header class="hero">
        <div class="container">
            <h1>Khai Phóng Tiềm Năng Giáo Dục Với AI Cùng Tâm Vạn Phúc</h1>
