<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tối Ưu Công Việc Cùng Tâm Vạn Phúc - Đột Phá Hiệu Suất Của Bạn</title>
    <meta name="description" content="Khám phá các giải pháp tối ưu công việc từ hệ sinh thái Tâm Vạn Phúc để tăng năng suất, giảm căng thẳng và có cuộc sống cân bằng hơn.">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2e7d32; /* Màu xanh lá đậm của Tâm Vạn Phúc */
            --secondary-color: #4caf50; /* Xanh lá nhạt hơn */
            --accent-color: #ff9800; /* Màu cam nổi bật */
            --text-color: #333;
            --light-text-color: #f4f4f4;
            --background-light: #f9f9f9;
            --background-dark: #2c3e50; /* Darker background for contrast */
            --white: #fff;
            --shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            --border-radius: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background-color: var(--background-light);
            scroll-behavior: smooth;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Header / Hero Section */
        .hero {
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://source.unsplash.com/1600x900/?productivity,office,focus') no-repeat center center/cover;
            color: var(--white);
            text-align: center;
            padding: 100px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 70vh;
        }

        .hero h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 3.5em;
            margin-bottom: 20px;
            line-height: 1.2;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .hero p {
            font-size: 1.5em;
            margin-bottom: 40px;
            max-width: 800px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.4);
        }

        .btn {
            display: inline-block;
            background-color: var(--accent-color);
            color: var(--white);
            padding: 15px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 1.2em;
            transition: background-color 0.3s ease, transform 0.3s ease;
            box-shadow: var(--shadow);
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #e68a00; /* Darker accent */
            transform: translateY(-3px);
        }

        /* Section Styling */
        section {
            padding: 80px 0;
            text-align: center;
        }

        section:nth-of-type(even) {
            background-color: var(--white);
        }

        section h2 {
            font-family: 'Montserrat', sans-serif;
            font-size: 2.8em;
            color: var(--primary-color);
            margin-bottom: 40px;
            position: relative;
            padding-bottom: 15px;
        }

        section h2::after {
            content: '';
            position: absolute;
            left: 50%;
            bottom: 0;
            transform: translateX(-50%);
            width: 80px;
            height: 4px;
            background-color: var(--accent-color);
            border-radius: 2px;
        }

        section p {
            font-size: 1.1em;
            margin-bottom: 20px;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Problem Section */
        .problem-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            margin-top: 50px;
        }

        .problem-item {
            background-color: var(--white);
            padding: 30px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            text-align: left;
            border-top: 5px solid var(--secondary-color);
            transition: transform 0.3s ease;
        }
        
        .problem-item:hover {
            transform: translateY(-5px);
        }

        .problem-item h3 {
            font-family: 'Montserrat', sans-serif;
            color: var(--primary-color);
            font-size: 1.5em;
            margin-bottom: 15px;
        }

        .problem-item p {
            font-size: 1em;
            margin-bottom: 0;
        }

        /* Solution Section */
        .solution {
            background-color: var(--primary-color);
            color: var(--light-text-color);
        }

        .solution h2 {
            color: var(--white);
        }
        
        .solution h2::after {
            background-color: var(--accent-color);
        }

        .solution-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
            margin-top: 50px;
        }

        .solution-card {
            background-color: rgba(255, 255, 255, 0.15);
            padding: 30px;
            border-radius: var(--border-radius);
            text-align: left;
            transition: background-color 0.3s ease;
        }

        .solution-card:hover {
            background-color: rgba(255, 255, 255, 0.25);
        }

        .solution-card h3 {
            font-family: 'Montserrat', sans-serif;
            color: var(--accent-color);
            font-size: 1.6em;
            margin-bottom: 15px;
        }

        .solution-card p {
            font-size: 1.05em;
            margin-bottom: 0;
            color: var(--light-text-color);
        }

        /* Benefits Section */
        .benefits-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            margin-top: 50px;
        }

        .benefit-item {
            background-color: var(--white);
            padding: 30px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: transform 0.3s ease;
            height: 100%; /* Ensure uniform height for flex items */
        }
        
        .benefit-item:hover {
            transform: translateY(-5px);
        }

        .benefit-item .icon {
            font-size: 3em;
            color: var(--secondary-color);
            margin-bottom: 15px;
        }

        .benefit-item h3 {
            font-family: 'Montserrat', sans-serif;
            color: var(--primary-color);
            font-size: 1.4em;
            margin-bottom: 10px;
        }

        .benefit-item p {
            font-size: 0.95em;
            margin-bottom: 0;
        }

        /* Final CTA */
        .cta-final {
            background-color: var(--background-dark);
            color: var(--white);
        }

        .cta-final h2 {
            color: var(--accent-color);
        }
        
        .cta-final h2::after {
            background-color: var(--secondary-color);
        }

        .cta-final p {
            color: var(--light-text-color);
            margin-bottom: 40px;
        }

        /* Footer */
        footer {
            background-color: var(--text-color);
            color: var(--light-text-color);
            text-align: center;
            padding: 30px 20px;
            font-size: 0.9em;
        }

        /* Responsive Design */
        @media (max-width: 992px) {
            .hero h1 {
                font-size: 2.8em;
            }
            .hero p {
                font-size: 1.3em;
            }
            section h2 {
                font-size: 2.2em;
            }
        }

        @media (max-width: 768px) {
            .hero {
                padding: 80px 15px;
            }
            .hero h1 {
                font-size: 2.2em;
            }
            .hero p {
                font-size: 1.1em;
            }
            .btn {
                padding: 12px 25px;
                font-size: 1.1em;
            }
            section {
                padding: 60px 0;
            }
            section h2 {
                font-size: 1.8em;
            }
            .problem-list, .solution-grid, .benefits-list {
                grid-template-columns: 1fr;
            }
            .problem-item, .solution-card, .benefit-item {
                padding: 25px;
            }
        }

        @media (max-width: 480px) {
            .hero h1 {
                font-size: 1.8em;
            }
            .hero p {
                font-size: 1em;
            }
            .btn {
                font-size: 1em;
                padding: 10px 20px;
            }
            section h2 {
                font-size: 1.6em;
            }
        }
    </style>
