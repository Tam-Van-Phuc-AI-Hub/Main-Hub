<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lofi Music - Thư Giãn Cùng Tâm Vạn Phúc</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #6a5acd; /* Soft periwinkle/lavender */
            --secondary-color: #8a2be2; /* Blue violet */
            --accent-color: #e0b0ff; /* Light purple */
            --text-color: #ffffff;
            --subtle-text-color: #ccc;
            --background-gradient-start: #3b2a5c; /* Darker purple */
            --background-gradient-end: #1a1a2e; /* Very dark blue/purple */
            --button-bg: #e0b0ff; /* Light purple */
            --button-text: #3b2a5c; /* Darker text for button */
        }

        body {
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 0;
            color: var(--text-color);
            background: linear-gradient(135deg, var(--background-gradient-start) 0%, var(--background-gradient-end) 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Subtle background animation */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 80%, rgba(138, 43, 226, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 20%, rgba(106, 90, 205, 0.1) 0%, transparent 50%);
            animation: backgroundShift 15s infinite alternate ease-in-out;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes backgroundShift {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }

        .container {
            background-color: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            border-radius: 15px;
            padding: 40px;
            margin: 20px;
            max-width: 800px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
            z-index: 1;
            animation: fadeInScale 1s ease-out forwards;
        }

        @keyframes fadeInScale {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.2em;
            margin-bottom: 15px;
            color: var(--accent-color);
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(224, 176, 255, 0.5);
            animation: textGlow 2s infinite alternate ease-in-out;
        }

        @keyframes textGlow {
            from { text-shadow: 0 0 8px var(--accent-color); }
            to { text-shadow: 0 0 16px var(--accent-color), 0 0 24px rgba(224, 176, 255, 0.3); }
        }

        p {
            font-size: 1.2em;
            line-height: 1.6;
            margin-bottom: 30px;
            color: var(--subtle-text-color);
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .cta-button {
            display: inline-block;
            background-color: var(--button-bg);
            color: var(--button-text);
            padding: 15px 35px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 1.3em;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            border: none;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            z-index: 2;
        }

        .cta-button:hover {
            background-color: #cc99ff; /* Slightly darker light purple */
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .cta-button::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 5px;
            height: 5px;
            background: rgba(255, 255, 255, 0.8);
            opacity: 0;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.5s ease-out;
        }

        .cta-button:hover::after {
            width: 200px;
            height: 200px;
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .footer {
            margin-top: 40px;
            font-size: 0.9em;
            color: rgba(255, 255, 255, 0.6);
            position: relative;
            z-index: 1;
            animation: fadeIn 2s ease-out forwards;
            animation-delay: 0.5s;
            opacity: 0;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .logo-text {
            font-family: 'Playfair Display', serif;
            font-size: 1.2em;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 10px;
            display: block;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.5em;
            }
            p {
                font-size: 1em;
            }
            .cta-button {
                padding: 12px 25px;
                font-size: 1.1em;
            }
            .container {
                padding: 25px;
                margin: 15px;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 2em;
            }
            p {
                font-size: 0.9em;
            }
            .cta-button {
                padding: 10px 20px;
                font-size: 1em;
            }
            .container {
                padding: 20px;
                margin: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="logo-text">Tâm Vạn Phúc</span>
        <h1>Lạc Trôi Trong Giai Điệu Lofi</h1>
        <p>Tìm lại sự bình yên, xoa dịu tâm hồn và nâng cao sự tập trung với bộ sưu tập lofi music tuyển chọn đặc biệt từ hệ sinh thái Tâm Vạn Phúc.</p>
        <a href="afl_b08327f13ac81560aef9d64707d0592420ac9cda" target="_blank" rel="noopener noreferrer" class="cta-button">
            Khám Phá Ngay
        </a>
    </div>
    <footer class="footer">
        © 2023 Tâm Vạn Phúc - Mọi Quyền Được Bảo Lưu.
    </footer>
</body>
</html>
