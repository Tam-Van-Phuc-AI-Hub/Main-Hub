    <title>Health AI & Tâm Vạn Phúc - Tương Lai Sức Khỏe Của Bạn</title>
    <meta name="description" content="Khám phá sức mạnh của Trí tuệ Nhân tạo trong lĩnh vực y tế cùng Tâm Vạn Phúc. Cá nhân hóa chăm sóc sức khỏe, dự đoán bệnh tật sớm và nâng cao chất lượng cuộc sống.">
    <meta name="keywords" content="health ai, trí tuệ nhân tạo y tế, tâm vạn phúc, chăm sóc sức khỏe, y tế 4.0, sức khỏe cá nhân hóa, dự đoán bệnh">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #28a745; /* Green for health */
            --secondary-color: #007bff; /* Blue for tech/AI */
            --accent-color: #ffc107; /* Yellow for highlights */
            --dark-color: #343a40;
            --light-color: #f8f9fa;
            --text-color: #495057;
            --heading-font: 'Montserrat', sans-serif;
            --body-font: 'Roboto', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--body-font);
            line-height: 1.6;
            color: var(--text-color);
            background-color: var(--light-color);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        h1, h2, h3 {
            font-family: var(--heading-font);
            color: var(--dark-color);
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 3rem;
            line-height: 1.2;
        }

        h2 {
            font-size: 2rem;
            margin-bottom: 1.5rem;
        }

        h3 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        p {
            margin-bottom: 1rem;
        }

        .btn {
            display: inline-block;
            background: var(--primary-color);
            color: #fff;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 700;
            font-family: var(--heading-font);
            transition: background-color 0.3s ease, transform 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
        }

        .btn:hover {
            background: #218838; /* Darker green */
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
        }

        /* Header / Hero Section */
        .hero {
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1576091160399-112255761899?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=M3w0NTQ5ODJ8MHwxfHNlYXJjaHw1fHNoZWFsJTIwYWklMkNoZWFsdGhjYXJlJTIwYWl8ZW58MHx8fHwxNzA2ODk5MDAwfDA&ixlib=rb-4.0.3&q=80&w=1080') no-repeat center center/cover;
            color: #fff;
            text-align: center;
            padding: 100px 20px;
            min-height: 600px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5); /* Overlay to make text readable */
        }

        .hero-content {
            position: relative;
            z-index: 1;
            max-width: 800px;
            margin: auto;
        }

        .hero h1 {
            color: #fff;
            font-size: 3.5rem;
            margin-bottom: 1.5rem;
        }

        .hero p {
            font-size: 1.3rem;
            margin-bottom: 2.5rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Features Section */
        .features {
            padding: 80px 0;
            background-color: #fff;
            text-align: center;
        }

        .features .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 50px;
        }

        .feature-item {
            padding: 30px;
            background: var(--light-color);
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
            text-align: left;
        }

        .feature-item:hover {
            transform: translateY(-5px);
        }

        .feature-item i {
            font-size: 3rem;
            color: var(--secondary-color);
            margin-bottom: 20px;
            display: block;
        }

        .feature-item h3 {
            color: var(--primary-color);
            margin-bottom: 15px;
        }

        /* About Section (Tâm Vạn Phúc) */
        .about {
            padding: 80px 0;
            background-color: var(--primary-color);
            color: #fff;
            text-align: center;
        }

        .about h2 {
            color: #fff;
        }

        .about p {
            max-width: 800px;
            margin: 0 auto 30px auto;
            font-size: 1.1rem;
        }

        /* Call to Action Section */
        .cta-section {
            background-color: var(--dark-color);
            color: #fff;
            padding: 80px 0;
            text-align: center;
        }

        .cta-section h2 {
            color: #fff;
            margin-bottom: 20px;
        }

        .cta-section p {
            font-size: 1.2rem;
            margin-bottom: 40px;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Footer */
        .footer {
            background-color: #333;
            color: #ccc;
            text-align: center;
            padding: 30px 0;
            font-size: 0.9rem;
        }

        .footer p a {
            color: var(--primary-color);
            text-decoration: none;
        }

        .footer p a:hover {
            text-decoration: underline;
        }

        /* Responsive Adjustments */
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2.5rem;
            }

            .hero p {
                font-size: 1rem;
            }

            h1 {
                font-size: 2.5rem;
            }
            h2 {
                font-size: 1.8rem;
            }
            h3 {
                font-size: 1.3rem;
            }

            .features .grid {
                grid-template-columns: 1fr;
            }

            .feature-item {
                text-align: center;
            }
            .feature-item i {
                margin: 0 auto 20px auto;
            }
        }

        @media (max-width: 480px) {
            .hero h1 {
                font-size: 2rem;
            }

            .hero p {
                font-size: 0.9rem;
            }

            .btn {
                padding: 12px 25px;
                font-size: 1rem;
            }

            .features, .about, .cta-section {
                padding: 50px 0;
            }
        }
    </style>
