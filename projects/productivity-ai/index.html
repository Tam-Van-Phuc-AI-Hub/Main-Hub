<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tâm Vạn Phúc - Tăng Tốc Năng Suất với AI</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Roboto:wght@300;400;500&display=swap');

        :root {
            --primary-color: #5B6BFB; /* Vibrant Blue */
            --secondary-color: #7B68EE; /* Medium Slate Blue */
            --accent-color: #28a745; /* Green for success/action */
            --text-dark: #333;
            --text-light: #f4f4f4;
            --bg-light: #ffffff;
            --bg-dark: #f8f9fa;
            --shadow-light: rgba(0, 0, 0, 0.1);
            --gradient-start: #5B6BFB;
            --gradient-end: #7B68EE;
        }

        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            line-height: 1.6;
            color: var(--text-dark);
            background-color: var(--bg-light);
            scroll-behavior: smooth;
        }

        *, *::before, *::after {
            box-sizing: inherit;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background: var(--bg-light);
            padding: 20px 0;
            border-bottom: 1px solid #eee;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 4px var(--shadow-light);
        }

        header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 24px;
            color: var(--primary-color);
            text-decoration: none;
        }

        .hero {
            background: linear-gradient(135deg, var(--gradient-start) 0%, var(--gradient-end) 100%);
            color: var(--text-light);
            text-align: center;
            padding: 100px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
            position: relative;
            overflow: hidden;
        }
        
        .hero::before {
            content: '';
            position: absolute;
            top: -50px;
            left: -50px;
            width: 200px;
            height: 200px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            filter: blur(80px);
        }

        .hero::after {
            content: '';
            position: absolute;
            bottom: -50px;
            right: -50px;
            width: 250px;
            height: 250px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            filter: blur(100px);
        }

        .hero-content {
            max-width: 800px;
            z-index: 1;
        }

        .hero h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 3.5em;
            margin-bottom: 20px;
            line-height: 1.1;
            font-weight: 700;
        }

        .hero p {
            font-size: 1.3em;
            margin-bottom: 40px;
            font-weight: 300;
            opacity: 0.9;
        }

        .btn {
            display: inline-block;
            background-color: var(--accent-color);
            color: var(--text-light);
            padding: 15px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            font-size: 1.1em;
            transition: background-color 0.3s ease, transform 0.2s ease;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #218838; /* Darker green */
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
        }

        .section-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 2.5em;
            text-align: center;
            margin-bottom: 60px;
            color: var(--primary-color);
            font-weight: 700;
            position: relative;
            padding-bottom: 15px;
        }

        .section-title::after {
            content: '';
            position: absolute;
            left: 50%;
            bottom: 0;
            transform: translateX(-50%);
            width: 80px;
            height: 4px;
            background-color: var(--accent-color);
            border-radius: 2px;
        }

        .features, .cta-section {
            padding: 80px 0;
            text-align: center;
            background-color: var(--bg-light);
        }
        
        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
            margin-top: 50px;
        }

        .feature-item {
            background-color: var(--bg-light);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px var(--shadow-light);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .feature-item:hover {
            transform: translateY(-10px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
        }

        .feature-item i {
            font-size: 3em;
            color: var(--primary-color);
            margin-bottom: 20px;
        }

        .feature-item h3 {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.5em;
            margin-bottom: 15px;
            color: var(--primary-color);
        }

        .feature-item p {
            font-size: 1em;
            color: #555;
        }

        .testimonial-section {
            background-color: var(--bg-dark);
            padding: 80px 0;
            text-align: center;
        }

        .testimonial-card {
            max-width: 800px;
            margin: 0 auto;
            background-color: var(--bg-light);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px var(--shadow-light);
        }

        .testimonial-card p {
            font-size: 1.2em;
            font-style: italic;
            margin-bottom: 20px;
            color: #444;
        }

        .testimonial-card .author {
            font-weight: 600;
            color: var(--primary-color);
            font-size: 1.1em;
        }

        .cta-section {
            background: linear-gradient(135deg, var(--gradient-start) 0%, var(--gradient-end) 100%);
            color: var(--text-light);
            padding: 100px 20px;
        }

        .cta-section h2 {
            font-family: 'Montserrat', sans-serif;
            font-size: 3em;
            margin-bottom: 30px;
            font-weight: 700;
            line-height: 1.2;
        }

        .cta-section p {
            font-size: 1.3em;
            margin-bottom: 40px;
            opacity: 0.9;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .cta-section .btn {
            background-color: #FFD700; /* Gold for highlight */
            color: var(--primary-color);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
        }
        
        .cta-section .btn:hover {
            background-color: #FFC107; /* Darker Gold */
            color: var(--primary-color);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        footer {
            background-color: #333;
            color: #aaa;
            text-align: center;
            padding: 40px 20px;
            font-size: 0.9em;
        }

        footer p {
            margin: 0;
        }

        footer a {
            color: var(--primary-color);
            text-decoration: none;
        }
