<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tâm Vạn Phúc | Nơi An Yên Tâm Hồn, Nâng Tầm Cuộc Sống</title>
    <meta name="description" content="Khám phá con đường đến sự bình yên nội tại, giảm căng thẳng và tăng cường sức khỏe tinh thần toàn diện cùng Tâm Vạn Phúc.">
    <meta name="keywords" content="sức khỏe tinh thần, tâm lý, thiền định, giảm stress, bình yên, Tâm Vạn Phúc, an ủi, hỗ trợ tâm lý">
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #6A8FD7; /* Muted Blue */
            --secondary-color: #F7D962; /* Soft Yellow */
            --accent-color: #5AA17A; /* Serene Green */
            --text-dark: #333;
            --text-light: #fff;
            --bg-light: #f9f9f9;
            --bg-dark: #2c3e50;
        }

        /* Base Reset */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            line-height: 1.6;
            color: var(--text-dark);
            background-color: var(--bg-light);
            overflow-x: hidden;
        }

        a {
            text-decoration: none;
            color: var(--primary-color);
        }

        img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Header */
        header {
            background-color: var(--text-light);
            padding: 15px 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-family: 'Merriweather', serif;
            font-size: 2em;
            font-weight: 700;
            color: var(--primary-color);
            text-align: center;
        }

        /* Hero Section */
        .hero {
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1549082984-7867375d8438?q=80&w=2070&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D') no-repeat center center/cover;
            color: var(--text-light);
            text-align: center;
            padding: 100px 20px;
            min-height: 60vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .hero h1 {
            font-family: 'Merriweather', serif;
            font-size: 3.5em;
            margin-bottom: 20px;
            line-height: 1.2;
        }

        .hero p {
            font-size: 1.4em;
            max-width: 800px;
            margin-bottom: 40px;
            font-weight: 300;
        }

        .btn {
            display: inline-block;
            background-color: var(--secondary-color);
            color: var(--text-dark);
            padding: 15px 35px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.2em;
            transition: background-color 0.3s ease, transform 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .btn:hover {
            background-color: var(--accent-color);
            color: var(--text-light);
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
        }

        /* Sections General */
        section {
            padding: 80px 0;
            text-align: center;
        }

        section h2 {
            font-family: 'Merriweather', serif;
            font-size: 2.8em;
            margin-bottom: 20px;
            color: var(--primary-color);
            position: relative;
            display: inline-block;
        }

        section h2::after {
            content: '';
            display: block;
            width: 80px;
            height: 4px;
            background-color: var(--secondary-color);
            margin: 10px auto 0;
            border-radius: 2px;
        }

        section p.lead {
            font-size: 1.3em;
            max-width: 900px;
            margin: 0 auto 50px;
            color: #555;
        }

        /* Features Section */
        .features {
            background-color: var(--bg-light);
        }

        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
            margin-top: 50px;
        }

        .feature-item {
            background-color: var(--text-light);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            text-align: left;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border-top: 5px solid var(--primary-color);
        }

        .feature-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.15);
        }

        .feature-item i {
            font-size: 3em;
            color: var(--accent-color);
            margin-bottom: 20px;
            display: block;
        }

        .feature-item h3 {
            font-family: 'Merriweather', serif;
            font-size: 1.8em;
            margin-bottom: 15px;
            color: var(--primary-color);
        }

        .feature-item p {
            font-size: 1.1em;
            color: #666;
        }

        /* Call to Action Final */
        .cta-final {
            background-color: var(--primary-color);
            color: var(--text-light);
            padding: 80px 20px;
        }

        .cta-final h2 {
            color: var(--text-light);
        }

        .cta-final h2::after {
            background-color: var(--secondary-color);
        }

        .cta-final p {
            font-size: 1.5em;
            max-width: 900px;
            margin: 0 auto 40px;
            font-weight: 300;
        }

        /* Footer */
        footer {
            background-color: var(--bg-dark);
            color: var(--text-light);
            padding: 40px 0;
            text-align: center;
            font-size: 0.9em;
        }

        footer p {
            margin: 0;
        }

        /* Responsive Design */
        @media (max-width: 992px) {
            .hero h1 {
                font-size: 2.8em;
            }
            .hero p {
                font-size: 1.2em;
            }
            section h2 {
                font-size: 2.2em;
            }
            section p.lead {
                font-size: 1.1em;
            }
            .feature-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .hero {
                padding: 80px 20px;
            }
            .hero h1 {
                font-size: 2.2em;
            }
            .hero p {
                font-size: 1em;
                margin-bottom: 30px;
            }
            .btn {
                padding: 12px 25px;
                font-size: 1em;
            }
            section {
                padding: 60px 0;
            }
            section h2 {
                font-size: 1.8em;
            }
            .feature-item {
                padding: 25px;
            }
            .feature-item h3 {
                font-size: 1.5em;
            }
            .cta-final p {
                font-size: 1.2em;
            }
        }

        @media (max-width: 480px) {
            .hero h1 {
                font-size: 1.8em;
            }
            .hero p {
                font-size: 0.9em;
            }
            .btn {
                padding: 10px 20px;
                font-size: 0.9em;
            }
            section h2 {
                font-size: 1.5em;
            }
        }
    </style>
